<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="Inter,Helvetica,Arial,sans-serif"><rect width="1200" height="750" fill="#fff"/><style>
.e{opacity:0;animation:in 13s ease infinite both}
@keyframes in{0%{opacity:0;transform:translateY(10px)}4%{opacity:1;transform:none}90%{opacity:1}97%,100%{opacity:0}}
.s{animation:hi 13s ease infinite both}
@keyframes hi{0%{fill:#fff;stroke:#C9C9C6}3%,90%{fill:#F7EEF3;stroke:#7B2D5B}97%,100%{fill:#fff;stroke:#C9C9C6}}
.w{transform-box:fill-box;transform-origin:center;animation:wv 1s ease-in-out infinite}
@keyframes wv{50%{transform:scaleY(.45)}}
@media (prefers-reduced-motion:reduce){.e,.s{animation:none;opacity:1}.s{fill:#F7EEF3;stroke:#7B2D5B}.w{animation:none}}
</style>
<g class="e" style="animation-delay:0s"><text x="64" y="150" font-size="18" font-weight="700" fill="#7B2D5B">Scambots · exploited trust</text><text font-size="44" font-weight="800" fill="#1A1A1A" letter-spacing="-1"><tspan x="64" y="210">When the</tspan><tspan x="64" y="262">relationship</tspan><tspan x="64" y="314">is the attack</tspan></text></g>
<g font-size="19" font-weight="700" fill="#1A1A1A">
<g style="animation-delay:.4s" class="e"><rect class="s" style="animation-delay:.6s" x="64" y="360" width="400" height="58" rx="8" stroke-width="2.5"/><text x="88" y="396"><tspan fill="#7B2D5B">01</tspan>  Build trust</text></g>
<g style="animation-delay:2.6s" class="e"><rect class="s" style="animation-delay:3.2s" x="64" y="430" width="400" height="58" rx="8" stroke-width="2.5"/><text x="88" y="466"><tspan fill="#7B2D5B">02</tspan>  A voice you know</text></g>
<g style="animation-delay:4.4s" class="e"><rect class="s" style="animation-delay:5s" x="64" y="500" width="400" height="58" rx="8" stroke-width="2.5"/><text x="88" y="536"><tspan fill="#7B2D5B">03</tspan>  Pressure and urgency</text></g>
<g style="animation-delay:6.2s" class="e"><rect class="s" style="animation-delay:6.8s" x="64" y="570" width="400" height="58" rx="8" stroke-width="2.5"/><text x="88" y="606"><tspan fill="#7B2D5B">04</tspan>  The ask</text></g>
</g>
<g class="e" style="animation-delay:8.4s"><text x="64" y="676" font-size="16" fill="#5E5E5C" font-family="ui-monospace,Menlo,monospace">Every step felt like care. Illustrative chat.</text></g>
<!-- phone -->
<g class="e" style="animation-delay:.2s"><rect x="620" y="40" width="460" height="670" rx="36" fill="#fff" stroke="#1A1A1A" stroke-width="3"/><rect x="622" y="42" width="456" height="78" rx="34" fill="#F5F5F4"/><rect x="622" y="90" width="456" height="30" fill="#F5F5F4"/><line x1="622" y1="120" x2="1078" y2="120" stroke="#E3E3E1" stroke-width="2"/><circle cx="672" cy="81" r="20" fill="#7B2D5B"/><text x="672" y="88" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">S</text><text x="704" y="78" font-size="19" font-weight="700" fill="#1A1A1A">Sam</text><text x="704" y="100" font-size="14" fill="#5E5E5C">online</text></g>
<g font-size="17">
<g class="e" style="animation-delay:.8s"><rect x="648" y="144" width="300" height="62" rx="16" fill="#F5F5F4"/><text fill="#1A1A1A"><tspan x="668" y="170">So happy we matched. How</tspan><tspan x="668" y="193">was your day today?</tspan></text></g>
<g class="e" style="animation-delay:1.5s"><rect x="828" y="218" width="226" height="40" rx="16" fill="#1A1A1A"/><text x="848" y="244" fill="#fff">Long, but better now</text></g>
<g class="e" style="animation-delay:2.1s"><rect x="648" y="270" width="320" height="62" rx="16" fill="#F5F5F4"/><text fill="#1A1A1A"><tspan x="668" y="296">I feel like I've known you</tspan><tspan x="668" y="319">for years.</tspan></text></g>
<g class="e" style="animation-delay:3.2s"><rect x="648" y="344" width="340" height="62" rx="16" fill="#F7EEF3" stroke="#7B2D5B" stroke-width="2"/><circle cx="676" cy="375" r="15" fill="#7B2D5B"/><path d="M671 367 L683 375 L671 383 Z" fill="#fff"/><g fill="#7B2D5B"><rect class="w" x="702" y="365" width="5" height="20" rx="2"/><rect class="w" style="animation-delay:.15s" x="712" y="360" width="5" height="30" rx="2"/><rect class="w" style="animation-delay:.3s" x="722" y="368" width="5" height="14" rx="2"/><rect class="w" style="animation-delay:.45s" x="732" y="358" width="5" height="34" rx="2"/><rect class="w" style="animation-delay:.6s" x="742" y="364" width="5" height="22" rx="2"/><rect class="w" style="animation-delay:.2s" x="752" y="369" width="5" height="12" rx="2"/><rect class="w" style="animation-delay:.35s" x="762" y="361" width="5" height="28" rx="2"/><rect class="w" style="animation-delay:.5s" x="772" y="366" width="5" height="18" rx="2"/></g><text x="792" y="372" font-size="15" font-weight="700" fill="#7B2D5B">Voice message</text><text x="792" y="392" font-size="14" fill="#5E5E5C">0:12 · sounds just like Sam</text></g>
<g class="e" style="animation-delay:5s"><rect x="648" y="418" width="340" height="85" rx="16" fill="#F5F5F4"/><text fill="#1A1A1A"><tspan x="668" y="444">I'm stuck at the airport and my</tspan><tspan x="668" y="467">card is blocked. I need help in</tspan><tspan x="668" y="490" font-weight="700" fill="#7B2D5B">the next hour.</tspan></text></g>
<g class="e" style="animation-delay:6.8s"><rect x="648" y="515" width="340" height="85" rx="16" fill="#7B2D5B"/><text fill="#fff"><tspan x="668" y="541" font-weight="700">Can you send €400? Or a</tspan><tspan x="668" y="564">photo, just for me. Please</tspan><tspan x="668" y="587">don't tell anyone.</tspan></text></g>
<g class="e" style="animation-delay:8s"><rect x="944" y="614" width="90" height="40" rx="16" fill="#E9E9E7"/><circle cx="968" cy="634" r="5" fill="#8E8E8B"/><circle cx="986" cy="634" r="5" fill="#8E8E8B"/><circle cx="1004" cy="634" r="5" fill="#8E8E8B"/></g>
</g>
</svg>
