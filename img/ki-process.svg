<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Inter,Helvetica,Arial,sans-serif"><rect width="1200" height="720" fill="#fff"/><style>
.e{opacity:0;animation:in 10s ease infinite both}
.ln{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 10s ease infinite both}
@keyframes in{0%{opacity:0;transform:translateY(10px)}6%{opacity:1;transform:none}88%{opacity:1}96%,100%{opacity:0}}
@keyframes draw{0%{stroke-dashoffset:1200;opacity:1}10%{stroke-dashoffset:0}88%{opacity:1;stroke-dashoffset:0}96%,100%{opacity:0;stroke-dashoffset:0}}
.dot{animation:mv 10s linear infinite}
@keyframes mv{0%{transform:translateX(0)}45%{transform:translateX(1060px)}46%,100%{transform:translateX(1060px);opacity:0}}
@media (prefers-reduced-motion:reduce){.e,.ln{animation:none;opacity:1;stroke-dashoffset:0}.dot{display:none}}
